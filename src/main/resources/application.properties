spring.application.name=billing
# DB credentials come from the environment. Set DB_PASSWORD before starting the app,
# or put real values in application-local.properties (gitignored) and run with
# -Dspring.profiles.active=local
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nilgiri_kitchen}
spring.datasource.username=${DB_USERNAME:nilgiri}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
